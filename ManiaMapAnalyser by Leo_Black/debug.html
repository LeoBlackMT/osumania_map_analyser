<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MapAnalysis Debug</title>
    <style>
        :root {
            --bg: #0f1424;
            --panel: rgba(23, 31, 54, 0.82);
            --border: rgba(255, 255, 255, 0.18);
            --text: #eef2ff;
            --soft: #b8c2e6;
            --ok: #82efb3;
            --warn: #ffd36c;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(1200px 700px at 10% 0%, #263863, #0d1220 60%);
            color: var(--text);
            font-family: "Consolas", "Courier New", monospace;
            min-height: 100%;
        }

        main {
            width: min(1200px, 96vw);
            margin: 18px auto;
            padding: 14px;
            border-radius: 12px;
            background: var(--panel);
            border: 1px solid var(--border);
            backdrop-filter: blur(6px);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 22px;
        }

        .row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 999px;
            border: 1px solid var(--border);
            color: var(--soft);
            font-size: 13px;
        }

        .badge.ok {
            color: var(--ok);
        }

        .badge.warn {
            color: var(--warn);
        }

        button {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 7px 10px;
            color: var(--text);
            background: rgba(255, 255, 255, 0.08);
            cursor: pointer;
            font-family: inherit;
        }

        select {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 7px 9px;
            color: var(--text);
            background: rgba(15, 20, 36, 0.96);
            font-family: inherit;
            min-width: 220px;
        }

        .estimator-debug-panel {
            margin: 14px 0;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.18);
        }

        .estimator-debug-header {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .estimator-debug-header h2 {
            margin: 0 0 6px;
            font-size: 18px;
        }

        .estimator-debug-meta,
        .estimator-debug-note,
        .estimator-debug-empty,
        .estimator-debug-running {
            color: var(--soft);
            font-size: 12px;
            line-height: 1.45;
        }

        .estimator-debug-actions,
        .estimator-debug-slot-top,
        .estimator-debug-counter,
        .estimator-debug-result-line {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .estimator-debug-actions {
            justify-content: flex-end;
        }

        .estimator-debug-slots {
            display: grid;
            gap: 10px;
        }

        .estimator-debug-slot {
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
        }

        .estimator-debug-slot-top {
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .estimator-debug-counter span,
        .estimator-debug-result-line span {
            color: var(--soft);
            font-size: 12px;
        }

        .estimator-debug-result-line {
            margin-top: 8px;
        }

        .estimator-debug-result-line strong {
            color: var(--ok);
            font-size: 15px;
        }

        .estimator-debug-error {
            margin-top: 8px;
            color: var(--warn);
            font-size: 12px;
            line-height: 1.45;
        }

        pre {
            margin: 0;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.45;
            font-size: 13px;
            max-height: 72vh;
            overflow: auto;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.28);
        }

        details {
            margin-bottom: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.18);
        }

        summary {
            cursor: pointer;
            font-size: 14px;
            font-weight: inherit;
            user-select: none;
            padding: 2px 0;
        }

        summary:hover {
            color: var(--text);
        }

        .module-body {
            padding-top: 10px;
        }

        .kv {
            display: grid;
            grid-template-columns: max-content 1fr;
            gap: 2px 12px;
            font-size: 13px;
        }

        .kv dt {
            color: var(--soft);
        }

        .kv dd {
            margin: 0;
            color: var(--text);
        }

        .kv dd strong {
            color: var(--ok);
        }

        .surface-map-info {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 13px;
            padding: 8px 0 4px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 10px;
        }

        .surface-map-info .badge {
            font-size: 12px;
        }

        .surface-dim {
            opacity: 0.55;
        }

        .surface-hero {
            display: flex;
            gap: 10px;
            align-items: stretch;
            margin: 10px 0 4px;
        }

        .surface-pp-cell {
            flex: 1;
            min-width: 0;
            text-align: center;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 6px;
            background: rgba(0, 0, 0, 0.18);
        }

        .surface-pp-value {
            font-size: 22px;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
        }

        .surface-pp-label {
            font-size: 11px;
            color: var(--soft);
            margin-top: 2px;
        }

        .surface-hero-pp {
            border-color: var(--ok);
        }

        .surface-hero-pp .surface-pp-value {
            color: var(--ok);
            font-size: 26px;
        }

        .surface-hero-delta {
            font-size: 12px;
            color: var(--warn);
            text-align: right;
            margin-bottom: 6px;
        }

        .surface-group {
            margin: 10px 0;
            padding: 8px 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.12);
        }

        .surface-group-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--ok);
            margin-bottom: 6px;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 4px;
        }

        .surface-footnote {
            margin-top: 8px;
        }
    </style>
</head>

<body>
    <main>
        <h1>MapAnalysis api_v2 Debug</h1>
        <div class="row">
            <span id="conn" class="badge warn">Connecting...</span>
            <span id="count" class="badge">Messages: 0</span>
            <button id="pause-btn" type="button">Pause</button>
            <button id="clear-btn" type="button">Clear</button>
        </div>
        <details id="module-estimator" open>
            <summary>Estimator Compare</summary>
            <div id="estimator-debug-root" class="module-body"></div>
        </details>
        <details id="module-surface">
            <summary>Surface Timing Compare <span id="surface-version-badge" class="badge" hidden></span></summary>
            <div id="surface-timing-root" class="module-body"></div>
        </details>
        <details id="module-payload">
            <summary>Raw payload</summary>
            <pre id="payload" class="module-body">Waiting for websocket data...</pre>
        </details>
    </main>

    <script type="module">
        import WebSocketManager from "./js/app/socket.js";
        import { createEstimatorDebugPanel } from "./js/debug/estimatorDebugPanel.js";
        import { createSurfaceTimingPanel } from "./js/debug/surfaceTimingPanel.js";
        import { SURFACE_TIMING_MODEL } from "./js/debug/surfaceTimingCurve.js";

        const payloadEl = document.getElementById("payload");
        const connEl = document.getElementById("conn");
        const countEl = document.getElementById("count");
        const pauseBtn = document.getElementById("pause-btn");
        const clearBtn = document.getElementById("clear-btn");
        const estimatorPanel = createEstimatorDebugPanel({
            root: document.getElementById("estimator-debug-root"),
            socketHost: "127.0.0.1:24050",
        });
        // Surface Timing panel — real instance (S4), mounted at S5.
        const surfacePanel = createSurfaceTimingPanel({
            root: document.getElementById("surface-timing-root"),
            socketHost: "127.0.0.1:24050",
        });
        const surfaceVersionBadge = document.getElementById("surface-version-badge");
        surfaceVersionBadge.textContent = `v${SURFACE_TIMING_MODEL.VERSION}`;
        surfaceVersionBadge.hidden = false;

        const LAYOUT_KEY = "mma-debug-layout-v1";
        const LAYOUT_KEYS = {
            "module-estimator": "estimator",
            "module-surface": "surface",
            "module-payload": "payload",
        };
        const layout = { estimator: true, surface: false, payload: false };

        try {
            const saved = JSON.parse(localStorage.getItem(LAYOUT_KEY));
            if (saved && typeof saved === "object") {
                for (const key of Object.keys(layout)) {
                    if (typeof saved[key] === "boolean") {
                        layout[key] = saved[key];
                    }
                }
            }
        } catch {
            // Missing/corrupt stored layout: keep defaults.
        }

        for (const [id, key] of Object.entries(LAYOUT_KEYS)) {
            const details = document.getElementById(id);
            details.open = layout[key];
            details.addEventListener("toggle", () => {
                layout[key] = details.open;
                try {
                    localStorage.setItem(LAYOUT_KEY, JSON.stringify(layout));
                } catch {
                    // Storage unavailable: layout persistence is best-effort.
                }
            });
        }

        let paused = false;
        let messageCount = 0;

        function setConnectionState(kind, text) {
            connEl.className = `badge ${kind}`.trim();
            connEl.textContent = text;
        }

        function updateCount() {
            countEl.textContent = `Messages: ${messageCount}`;
        }

        pauseBtn.addEventListener("click", () => {
            paused = !paused;
            pauseBtn.textContent = paused ? "Resume" : "Pause";
        });

        clearBtn.addEventListener("click", () => {
            payloadEl.textContent = "Cleared.";
            messageCount = 0;
            updateCount();
        });

        const socket = new WebSocketManager("127.0.0.1:24050");
        setConnectionState("warn", "Connecting...");

        socket.api_v2((data) => {
            setConnectionState("ok", "Connected");
            if (layout.estimator) estimatorPanel.handleSocketPayload(data);
            if (layout.surface && typeof surfacePanel?.handleSocketPayload === "function") surfacePanel.handleSocketPayload(data);
            if (layout.payload && !paused) {
                messageCount += 1;
                updateCount();
                payloadEl.textContent = JSON.stringify(data, null, 2);
            }
        });

        window.addEventListener("error", (event) => {
            setConnectionState("warn", "Runtime Error");
            payloadEl.textContent = `Error: ${event.message}`;
        });
    </script>
</body>

</html>
