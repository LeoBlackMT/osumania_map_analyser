name: backend-build

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  build-linux:
    name: Build telemetry-server (linux/amd64)
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build release
        working-directory: backend
        run: go build -trimpath -ldflags="-s -w -X main.version=1.1.2" -o bin/telemetry-server ./cmd/server
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-server-linux-amd64
          path: backend/bin/telemetry-server
          if-no-files-found: error
