name: shell-build

# 仅构建 Windows：Etterna（Windows 优先，Linux 有社区 build）与 Malody V
# （仅 Windows/Android/iOS，无 Linux 版）——shell 的桥接目标均不支持 Linux，
# 无 Linux 产物必要。手动触发仍可用。
on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build shell (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release
        working-directory: desktop
        run: cargo build --release --locked
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mma-shell-windows
          path: desktop/target/release/mma-shell.exe
          if-no-files-found: error