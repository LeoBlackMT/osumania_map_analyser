name: shell-build

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/shell-build.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/shell-build.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: Build shell (Windows)
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test PR build
        if: github.event_name == 'pull_request'
        working-directory: desktop
        run: cargo test --release --locked
      - name: Build release
        if: github.event_name != 'pull_request'
        shell: bash
        working-directory: desktop
        env:
          MMA_FEEDBACK_SIGNING_SEED: ${{ secrets.MMA_FEEDBACK_SIGNING_SEED }}
          MMA_FEEDBACK_KEY_ID: ${{ vars.MMA_FEEDBACK_KEY_ID || 'release' }}
        run: |
          if ! [[ "${MMA_FEEDBACK_SIGNING_SEED}" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::Configure the feedback signing seed before building a release."
            exit 1
          fi
          cargo build --release --locked
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: mma-shell-windows
          path: desktop/target/release/mma-shell.exe
          if-no-files-found: error

  build-linux:
    name: Build shell (Linux)
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - name: Test PR build
        if: github.event_name == 'pull_request'
        working-directory: desktop
        run: cargo test --release --locked
      - name: Build release
        if: github.event_name != 'pull_request'
        shell: bash
        working-directory: desktop
        env:
          MMA_FEEDBACK_SIGNING_SEED: ${{ secrets.MMA_FEEDBACK_SIGNING_SEED }}
          MMA_FEEDBACK_KEY_ID: ${{ vars.MMA_FEEDBACK_KEY_ID || 'release' }}
        run: |
          if ! [[ "${MMA_FEEDBACK_SIGNING_SEED}" =~ ^[[:xdigit:]]{64}$ ]]; then
            echo "::error::Configure the feedback signing seed before building a release."
            exit 1
          fi
          cargo build --release --locked
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: mma-shell-linux
          path: desktop/target/release/mma-shell
          if-no-files-found: error
